<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Web Player | CV_Gonzalo 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: #ffffff;
    }

    #unity-canvas {
      display: block;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 0;
      border: 0;
      max-width: none;
      max-height: none;
      overflow: hidden;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <canvas
    id="unity-canvas"
    width="1920"
    height="1080"
    tabindex="-1">
  </canvas>

  <script src="Build/builds.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    function resizeCanvas() {
      var availableWidth = document.documentElement.clientWidth;
      var availableHeight = document.documentElement.clientHeight;

      var scale = Math.min(
        availableWidth / 1920,
        availableHeight / 1080
      );

      canvas.style.width = (1920 * scale) + "px";
      canvas.style.height = (1080 * scale) + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/builds.data",
      frameworkUrl: "Build/builds.framework.js",
      codeUrl: "Build/builds.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "CV_Gonzalo 2026",
      productVersion: "1.0"
    }).then((unityInstance) => {
      resizeCanvas();
    }).catch((message) => {
      console.error(message);
      alert(message);
    });
  </script>
</body>
</html>
